# fly.toml app configuration file generated for single-page-app-red-sky-7569 on 2026-05-26T17:01:51+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'single-page-app-red-sky-7569'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[env]
  OLLAMA_BASE_URL = 'https://ollama.com'
  # Requests reach the app through Fly's proxy, so the per-client chat limits must read the real
  # client address from X-Forwarded-For. Remove this if the app is exposed without a proxy.
  TRUST_PROXY = 'true'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
